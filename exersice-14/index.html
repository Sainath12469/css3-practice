<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Product Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <section class="product-card">
      <div class="product-card__image">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80" alt="Premium leather watch">
      </div>
      <div class="product-card__content">
        <span class="product-card__category">Featured</span>
        <h1 class="product-card__title">Classic Leather Watch</h1>
        <p class="product-card__description">
          A timeless everyday watch with a sleek leather strap, minimalist dial, and durable stainless steel case.
        </p>
        <div class="product-card__footer">
          <span class="product-card__price">$149</span>
          <button class="product-card__button" type="button">Buy Now</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
